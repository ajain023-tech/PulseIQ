name: pulseiq
version: "0.2.0"
config-version: 2
profile: pulseiq

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "logs"]

models:
  pulseiq:
    +materialized: table
    staging:
      +tags: ["staging"]
    intermediate:
      +tags: ["intermediate"]
    marts:
      +tags: ["marts"]

data_tests:
  pulseiq:
    +severity: error
