name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: make install
      - name: Lint
        run: make lint
      - name: Generate small dataset
        run: pulseiq generate --small
      - name: Build warehouse (dbt models + tests)
        run: pulseiq build
      - name: Tests
        run: pytest -q -m "not slow"
