[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulseiq"
version = "0.2.0"
description = "PulseIQ - product analytics & experimentation platform: event pipeline, validated A/B engine, retention ML and an AI analyst."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Anushka Jain" }]
dependencies = [
  "pandas~=3.1.1",
  "numpy~=2.4.6",
  "pyarrow~=26.0.1",
  "duckdb~=2.0.0",
  "dbt-core~=1.12.7",
  "dbt-duckdb~=1.11.1",
  "typer~=0.29.1",
  "pydantic~=2.14.3",
  "scipy~=1.17.1",
  "pyyaml~=6.0.3",
  "statsmodels~=0.15.0",
  "scikit-learn~=1.9.1",
  "joblib~=1.6.0",
  "matplotlib~=3.11.2",
  "lifelines~=0.30.0",
  "shap~=0.51.0",
  "fastapi~=0.162.7",
  "uvicorn~=0.54.0",
  "httpx~=0.28.1",
  "sqlglot~=30.31.0",
  "streamlit~=1.67.0",
  "plotly~=7.1.0",
]

[project.optional-dependencies]
ai = ["anthropic~=2.8.0"]
dev = ["pytest~=9.2.0", "ruff~=0.17.5", "playwright~=1.65.2", "anthropic~=2.8.0"]

[project.scripts]
pulseiq = "pulseiq.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["legacy", "warehouse/target", "warehouse/dbt_packages"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ARG"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection idiom
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
# pytest fixtures are often requested only for their side effects
"tests/*" = ["ARG001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: full-size tests (deselect with -m 'not slow')"]
addopts = "-ra"
